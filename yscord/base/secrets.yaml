# DB credentials from the secret store (the ClusterSecretStore "secrets" lives in
# the deploy repo; which provider backs it is the environment's business).
# Postgres reads all three keys (envFrom); the app and the migration Job read
# user and password.
#
# Changing the password in the store updates this Secret, but NOT Postgres:
# POSTGRES_PASSWORD only applies when the data directory is first initialized.
# Rotating it means ALTER USER in the database as well.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  annotations:
    # Before Postgres and the app (wave 0+) need it. Argo CD waits until the
    # ExternalSecret reports the Secret synced.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets
  target:
    name: postgres-credentials
  # Listed one by one rather than dataFrom/extract: the manifest is the contract
  # for what the store must hold (openbao-local/scripts/secrets.sh reads it).
  data:
    - secretKey: POSTGRES_USER
      remoteRef: {key: yscord/postgres, property: POSTGRES_USER}
    - secretKey: POSTGRES_PASSWORD
      remoteRef: {key: yscord/postgres, property: POSTGRES_PASSWORD}
    - secretKey: POSTGRES_DB
      remoteRef: {key: yscord/postgres, property: POSTGRES_DB}
---
# Google OAuth client for the optional login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-oauth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets
  target:
    name: google-oauth
  data:
    - secretKey: client-id
      remoteRef: {key: yscord/google, property: client-id}
    - secretKey: client-secret
      remoteRef: {key: yscord/google, property: client-secret}
