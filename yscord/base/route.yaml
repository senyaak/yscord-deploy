# The app team's own route, attached from this namespace to the shared Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yscord
spec:
  parentRefs:
    - name: main
      namespace: edge
  hostnames:
    - yscord-web.senyaak.work
  rules:
    # Everything (SPA, /api, /ws) goes to the player for now; /api/stats will get
    # its own rule pointing at stats-service in stage 6.
    - backendRefs:
        - name: yscord
          port: 80
