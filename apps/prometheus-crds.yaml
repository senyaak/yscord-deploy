# The Prometheus Operator's CRDs (ServiceMonitor, PrometheusRule, ...), apart
# from the monitoring stack: apps declare their ServiceMonitors early, while the
# stack itself comes last and the site never waits for it.
# Version must match the operator in kube-prometheus-stack (apps/monitoring.yaml):
# chart 32.0.1 = operator v0.94.1 = kube-prometheus-stack 92.2.0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 32.0.1
    helm:
      valuesObject:
        crds:
          annotations:
            # Deleting a CRD deletes every object of that kind (all
            # ServiceMonitors, the Prometheus itself): never by a prune.
            argocd.argoproj.io/sync-options: Prune=false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Far too big for client-side apply.
      - ServerSideApply=true
