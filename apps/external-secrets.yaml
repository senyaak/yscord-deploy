# External Secrets Operator: turns ExternalSecret objects into Secrets, reading
# the values from an external store. Installed from its official Helm chart;
# Argo CD renders the chart itself (no helm CLI involved).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    # Its CRDs must exist before platform (wave 0) creates the secret store.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.12.0
    helm:
      # Trimmed for a small cluster. Every CRD costs API server memory (it keeps
      # each schema in several forms), every pod costs its own.
      valuesObject:
        # Only ClusterSecretStore + ExternalSecret are used. The generator CRDs
        # can't be switched off one by one.
        crds:
          createClusterExternalSecret: false
          createClusterGenerator: false
          createClusterPushSecret: false
          createPushSecret: false
          createSecretStore: false
        processClusterExternalSecret: false
        processClusterGenerator: false
        processClusterPushSecret: false
        processPushSecret: false
        processSecretStore: false
        # The admission webhook only validates ESO objects on create; without
        # it a broken one shows its error in its status instead.
        webhook:
          create: false
        certController:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too big for client-side apply's last-applied annotation.
      - ServerSideApply=true
