# Grafana's admin login, from the secret store (monitoring/grafana).
# The chart could generate a random password itself, but Argo CD renders the
# chart on every refresh without access to the live Secret, so the password
# would change every time: endless OutOfSync and a rolled-out Grafana.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secrets
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password
