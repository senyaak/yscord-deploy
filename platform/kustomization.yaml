# Cluster edge: the Gateway and its Envoy settings, the Cloudflare tunnel, and
# the secret store every ExternalSecret reads from.
# Needs the CRDs of Envoy Gateway and External Secrets (earlier sync wave).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - envoyproxy.yaml
  - gatewayclass.yaml
  - gateway.yaml
  - cloudflared.yaml
  - secret-store.yaml
