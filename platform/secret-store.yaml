# The one place that says where this environment's secrets live. ExternalSecrets
# only name the store ("secrets") and a key path, so switching providers (cloud
# secret manager, another Vault) means changing this object, nothing else.
#
# Lab: OpenBao on the host, reached over the cluster's docker network. Login is
# an AppRole whose role-id/secret-id sit in the Secret below: the one secret
# created by hand ("secret zero"), see the bootstrap script.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secrets
spec:
  provider:
    vault:
      server: http://openbao:8200
      path: secret
      version: v2
      auth:
        appRole:
          path: approle
          roleRef:
            name: openbao-approle
            namespace: external-secrets
            key: role-id
          secretRef:
            name: openbao-approle
            namespace: external-secrets
            key: secret-id
